[project]
name = "corvid-ad"
version = "1.3.0"
description = "Active Directory attack-surface and exploitability scanner (read-only assessment)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "corvid-ad contributors" }]
dependencies = [
    "ldap3>=2.9.1",
    "networkx>=3.0",
    "rich>=13.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.scripts]
corvid-ad = "corvid_ad.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
active = [
    "impacket>=0.12",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
