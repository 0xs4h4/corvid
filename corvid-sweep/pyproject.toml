[project]
name = "corvid-sweep"
version = "0.1.0"
description = "Two-pass TCP discovery across multiple targets, then service detection and a text report"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "corvid contributors" }]
dependencies = []

[project.scripts]
corvid-sweep = "corvid_sweep.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
